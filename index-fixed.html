<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حقيبة الكريستال الوردية</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4eff3;font-family:Tahoma,Arial,sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.header{position:fixed;top:clamp(18px,4vw,42px);right:clamp(18px,5vw,70px);z-index:5;pointer-events:none;text-align:right;color:#7b1745}.eyebrow{font-size:11px;letter-spacing:2.2px;color:#bd5b82;margin-bottom:10px}h1{margin:0;font-size:clamp(25px,4.2vw,50px);font-weight:500}.header p{margin:8px 0;color:#95647a}.info{position:fixed;bottom:clamp(18px,4vw,42px);right:clamp(18px,5vw,70px);z-index:5;padding:13px 17px;background:#ffffff80;border:1px solid #d2668f40;border-radius:50px;color:#9a4c6d;font-size:13px}</style></head><body><div id="scene"></div><div class="header"><div class="eyebrow">BEADED COLLECTION</div><h1>حقيبة الكريستال الوردية</h1><p>تصميم خرزي شفاف بتدرجات وردية لامعة</p></div><div class="info">اسحب لتدوير الحقيبة · مرّر للتكبير</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.161.0';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4eff3);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(8.2,4,11.7);camera.lookAt(0,.1,0);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a5061,2.8));const key=new THREE.DirectionalLight(0xffe8f1,3.5);key.position.set(-5,8,7);scene.add(key);const side=new THREE.PointLight(0xec2e73,10,14);side.position.set(5,3,4);scene.add(side);scene.add(new THREE.AmbientLight(0xffffff,1.2));
const bag=new THREE.Group();bag.position.y=.12;scene.add(bag);const W=5.9,H=4.35,D=.72,step=.265;const geo=new THREE.SphereGeometry(.145,14,10);const mat=new THREE.MeshLambertMaterial({color:0xff4d91});const pink=new THREE.Color('#e8276f'),rose=new THREE.Color('#f1689d'),pale=new THREE.Color('#ffd7e8'),crystal=new THREE.Color('#fff6fa');const tmp=new THREE.Object3D();
function make(points,fn){const m=new THREE.InstancedMesh(geo,mat,points.length);for(let i=0;i<points.length;i++){tmp.position.copy(points[i]);tmp.scale.setScalar(.93+(i%7)*.015);tmp.updateMatrix();m.setMatrixAt(i,tmp.matrix);m.setColorAt(i,fn?fn(points[i],i):pink)}m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true;m.castShadow=true;bag.add(m)}
const front=[],back=[],sides=[];for(let y=-H/2;y<=H/2+.01;y+=step){for(let x=-W/2;x<=W/2+.01;x+=step){const s=(Math.round((y+H/2)/step)%2)*step*.5;if(x+s<=W/2){front.push(new THREE.Vector3(x+s,y,D/2));back.push(new THREE.Vector3(x+s,y,-D/2))}}}for(let y=-H/2;y<=H/2+.01;y+=step)for(let z=-D/2+.05;z<=D/2;z+=step){sides.push(new THREE.Vector3(-W/2,y,z),new THREE.Vector3(W/2,y,z))}function body(p){const v=(p.y+H/2)/H;return v>.67?crystal.clone().lerp(pale,(v-.67)*1.5):rose.clone().lerp(pink,1-v*.7)}make(front,body);make(back,p=>body(p).multiplyScalar(.85));make(sides,p=>body(p).lerp(pink,.25));
const edge=[];for(let x=-W/2;x<=W/2;x+=step)edge.push(new THREE.Vector3(x,H/2+.03,D/2+.01),new THREE.Vector3(x,H/2+.03,-D/2-.01));make(edge,()=>pink);const flap=[];for(let r=0;r<8;r++){const y=H/2+.12-r*step,half=W/2-.18-r*.30;if(half<.1)break;for(let x=-half;x<=half;x+=step)flap.push(new THREE.Vector3(x,y,D/2+.18+r*.012))}make(flap,(p,i)=>rose.clone().lerp(pink,(i%6)/10));const flower=[new THREE.Vector3(0,.65,.70)];for(let i=0;i<8;i++){const a=i/8*Math.PI*2;flower.push(new THREE.Vector3(Math.cos(a)*.22,.65+Math.sin(a)*.22,.69))}make(flower,()=>new THREE.Color('#d91361'));
const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(-W/2-.04,H/2+.1,.08),new THREE.Vector3(-4.05,1.35,0),new THREE.Vector3(-4.3,-2.6,.25),new THREE.Vector3(-2.8,-3.05,1.6),new THREE.Vector3(0,-3.25,2.15),new THREE.Vector3(2.8,-3.17,1.55),new THREE.Vector3(4.15,-2.6,.2),new THREE.Vector3(4.02,1.25,-.04),new THREE.Vector3(W/2+.04,H/2+.1,.08)]);const sp=curve.getPoints(180);const sg=new THREE.SphereGeometry(.12,12,9);const sm=new THREE.InstancedMesh(sg,mat,sp.length);for(let i=0;i<sp.length;i++){tmp.position.copy(sp[i]);tmp.scale.setScalar(.94+Math.sin(i*1.71)*.04);tmp.updateMatrix();sm.setMatrixAt(i,tmp.matrix);sm.setColorAt(i,new THREE.Color('#ef77a7').lerp(new THREE.Color('#ffc2da'),(i%9)/15))}sm.instanceMatrix.needsUpdate=true;sm.instanceColor.needsUpdate=true;bag.add(sm);
let drag=false,lastX=0,lastY=0,auto=true,timer;renderer.domElement.onpointerdown=e=>{drag=true;auto=false;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;bag.rotation.y+=(e.clientX-lastX)*.008;bag.rotation.x=Math.max(-.28,Math.min(.28,bag.rotation.x+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY};renderer.domElement.onpointerup=e=>{drag=false;renderer.domElement.releasePointerCapture(e.pointerId);clearTimeout(timer);timer=setTimeout(()=>auto=true,1800)};renderer.domElement.onwheel=e=>{e.preventDefault();const f=Math.max(.75,Math.min(1.4,camera.position.length()*(1+e.deltaY*.0007)/Math.sqrt(8.2**2+4**2+11.7**2)));camera.position.set(8.2*f,4*f,11.7*f);camera.lookAt(0,.1,0);auto=false;clearTimeout(timer);timer=setTimeout(()=>auto=true,1500)};
let t=0;function animate(){requestAnimationFrame(animate);t+=.008;if(auto&&!drag)bag.rotation.y+=.0028;bag.position.y=.12+Math.sin(t)*.035;renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
